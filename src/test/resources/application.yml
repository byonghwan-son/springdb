spring:
  profiles:
    active: test
  datasource:
    generate-unique-name: false # jdbc:h2:mem:testdb
#    url: jdbc:h2:tcp://localhost/~/springdbtest
#    username: sa
#    password:
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        column-ordering-strategy: default
        #        show_sql: true
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.H2Dialect
    #        default_batch_fetch_size: 100
    open-in-view: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  #        one-indexed-parameters: true
  jackson:
    mapper:
      sort-properties-alphabetically: false
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
logging.level:
  #  org.hibernate.SQL: debug
  #  org.hibernate.type: trace
  org.springframework.jdbc: debug
  hello.itemservice.repository.mybatis: trace

#MyBatis
mybatis:
  type-aliases-package: hello.itemservice.domain
  configuration:
    map-underscore-to-camel-case: true